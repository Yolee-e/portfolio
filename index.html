<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yolesis Ivan Tinga | IT Professional Portfolio</title>
<meta name="description" content="Portfolio of an Information Technology graduate: IT support, computer hardware, networking, web development and desktop application projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--surface:#fff;--ink:#111a2e;--mute:#4a5670;--line:#dbe2ee;--navy:#080d1b;--blue:#2563EB;--cyan:#06B6D4;--link:#1d4ed8;
--hf:'Sora','Segoe UI',system-ui,sans-serif;--bf:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--surface:#0c1322;--ink:#e8eefc;--mute:#9db0d0;--line:#1d2844;--link:#5eead4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070b16;--surface:#0c1322;--ink:#e8eefc;--mute:#9db0d0;--line:#1d2844;--link:#5eead4;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--bf)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--hf);line-height:1.2;margin:0 0 .6rem}
h2{font-size:clamp(1.6rem,3vw,2.2rem)}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
.sub{color:var(--mute);max-width:60ch;margin:0 0 2rem}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{font:700 1.1rem var(--hf);text-decoration:none;color:var(--ink);margin-right:auto}
.logo b{color:var(--cyan)}
.links{display:flex;gap:2px}
.links a{padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--mute);font-size:.9rem}
.links a:hover,.links a.on{color:var(--ink);background:var(--surface)}
.icon{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
#burger{display:none}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;font:500 .95rem var(--bf);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{border-color:var(--cyan)}
.btn.sm{padding:8px 14px;font-size:.85rem}
.hero{background:radial-gradient(640px 420px at 88% 18%,#2563eb38,transparent 62%),radial-gradient(520px 380px at 8% 95%,#06b6d42b,transparent 60%),var(--navy);color:#e8eefc;padding:90px 0 80px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#1b2a4d55 1px,transparent 1px),linear-gradient(90deg,#1b2a4d55 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 40%,#000,transparent 70%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.6rem);animation:rise .8s both}
.hero .role{font:500 1.2rem var(--hf);color:#67e8f9;margin-bottom:1rem}
.hero p{color:#b6c4e2;max-width:52ch}
.hero .btn.alt{color:#e8eefc;border-color:#33466f}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.5rem}
.photo{position:relative;touch-action:pan-y;aspect-ratio:4/5;border-radius:24px;border:1px solid #33466f;background:linear-gradient(135deg,#12204a,#0e3a52);display:grid;place-items:center;overflow:hidden;font:700 4rem var(--hf);color:#67e8f9;max-width:340px;justify-self:center;width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .rv{position:absolute;inset:0;pointer-events:none;clip-path:circle(0 at 50% 50%)}
.photo .rv img{filter:saturate(1.25) contrast(1.06)}
.photo .bub{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.photo .bub .rim{filter:drop-shadow(0 0 5px #e11d2f) drop-shadow(0 0 14px #f5b54299)}
.photo:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--mute);font-size:.95rem}
.skill{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.95rem}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--cyan)}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:24px;display:grid;gap:22px}
.tl article{position:relative}
.tl article::before{content:"";position:absolute;left:-32px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:3px solid var(--bg)}
.tl .meta{color:var(--mute);font-size:.9rem;margin-bottom:.4rem}
.tl ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--mute)}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mute);margin:0 4px 4px 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.shot{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#12204a,#0e3a52);display:grid;place-items:center;color:#67e8f9;font:500 .85rem var(--bf);text-align:center;padding:10px;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:contain}
.proj{display:flex;flex-direction:column;gap:12px}
.proj .shot{margin:-4px -4px 0}
.proj.locked{border-style:dashed}
.proj.locked .shot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#0d1730,#0b2233);color:#67e8f9}
.proj.locked .shot svg{width:30px;height:30px}
.proj.locked .shot b{color:var(--ink);font:600 1rem var(--hf)}
.proj.locked .shot span{font-size:.82rem;color:var(--mute)}
.proj.locked h3{color:var(--mute)}
.proj.locked .btn{cursor:not-allowed;background:transparent;border:1px solid var(--line);color:var(--mute)}
.proj.locked:hover{transform:none;border-color:var(--line)}
.proj.locked:hover::after,.proj.locked:hover::before{opacity:0;animation:none}
.cert{cursor:pointer;text-align:left;font:inherit;color:inherit;display:block;width:100%}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:min(760px,94vw);width:100%;padding:0;max-height:90vh}
dialog::backdrop{background:#0b112099}
.dbody{padding:24px}
.dbody h4{font:700 1rem var(--hf);margin:1.2rem 0 .3rem}
.dbody ul{margin:0;padding-left:1.1rem;color:var(--mute)}
.dbody p{color:var(--mute);margin:0}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.x{float:right}
.note{font-size:.88rem;color:var(--mute)}
form{display:grid;gap:14px;max-width:560px}
label{font-size:.9rem;font-weight:500}
input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-top:4px}
.err{color:#dc2626;font-size:.82rem;min-height:1em;display:block}
:root[data-theme="dark"] .err{color:#fca5a5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#fca5a5}}
#status{padding:12px 14px;border-radius:10px;border:1px solid var(--line);display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.9rem}
#top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;z-index:40}
.nf{min-height:60vh;display:grid;place-items:center;text-align:center}
@media (max-width:860px){.hero .wrap,.two{grid-template-columns:1fr}.photo{order:-1;max-width:220px}
#burger{display:block}.links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}.links.open{display:flex}section{padding:56px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

/* midnight glass theme */
.card{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(12px)}
.gr{background:linear-gradient(90deg,#67e8f9,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid #1e3a5f;background:#06b6d41a;color:#67e8f9;font:500 .78rem var(--bf);letter-spacing:.04em;margin-bottom:18px}
.badge i{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.eb{font:500 .75rem var(--bf);letter-spacing:.16em;text-transform:uppercase;color:var(--link);margin-bottom:8px}
.cap{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);color:#e8eefc;font:400 .82rem/1.35 var(--bf);text-align:left;pointer-events:none;display:grid;justify-items:start}
.cap small{font:500 .62rem var(--bf);letter-spacing:.12em;text-transform:uppercase;color:#67e8f9}
.cap b{font:700 .95rem var(--hf)}
.chip{position:absolute;top:12px;right:12px;z-index:4;font:500 .7rem var(--bf);padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#e8eefc;pointer-events:none}
.filters{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.filters button{border:0;background:transparent;color:var(--mute)}
.filters button[aria-pressed="true"]{background:linear-gradient(90deg,var(--blue),#0891b2);color:#fff}
.tl article::before{box-shadow:0 0 12px var(--cyan)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:45;background:radial-gradient(520px circle at var(--gx,50%) var(--gy,30%),#06B6D41c,transparent 62%)}
.soc{display:flex;gap:12px;margin-top:16px}
.soc a{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);transition:transform .2s,border-color .2s,color .2s}
.soc a:hover{transform:translateY(-3px);border-color:var(--cyan)}
.soc a.fb:hover{color:#4c8dff}.soc a.wa:hover{color:#25d366}
.soc svg{width:22px;height:22px}
/* interactive mouse layer */
.hero::before{display:none}
#net{position:absolute;inset:0;width:100%;height:100%}
.card{position:relative;overflow:hidden;transition:border-color .2s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),#06B6D426,transparent 65%)}
.card:hover{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line))}
.card:hover::after{opacity:1}
.btn{transition:transform .2s,border-color .2s}
html.has-cur,html.has-cur *{cursor:none}
html.has-cur input,html.has-cur textarea{cursor:text}
html.has-cur dialog,html.has-cur dialog *{cursor:auto}
body:has(dialog[open]) .cur{display:none}
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:200;opacity:0;transition:opacity .2s}
.cur.on{opacity:1}
.cur.dot{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--cyan)}
.cur.ring{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--cyan) 80%,transparent);transition:opacity .2s,width .2s,height .2s,margin .2s,background .2s}
.cur.ring.big{width:60px;height:60px;margin:-30px 0 0 -30px;background:#06B6D41f}
.cur.ring.hide{opacity:0}
.cur.ring span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;padding:3px 8px;border-radius:6px;background:var(--navy);color:#e8eefc;font:500 .66rem/1.2 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.cur.ring span:empty{display:none}
/* motion layer */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes up{from{transform:translateY(110%)}}
@keyframes up2{from{opacity:0;transform:translateY(26px)}}
@keyframes fl{to{transform:translate(40px,-34px) scale(1.15)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes rip{to{transform:scale(12);opacity:0}}
.hero h1{animation:none}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em}
.w>span{display:inline-block;animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.gr{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit}
.gr .w>span{background:linear-gradient(90deg,#67e8f9,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .badge,.hero .role,.hero p,.hero .cta,.hero .photo{animation:up2 .9s cubic-bezier(.2,.8,.2,1) both}
.hero .badge{animation-delay:.05s}.hero .role{animation-delay:.45s}.hero p{animation-delay:.6s}.hero .cta{animation-delay:.75s}.hero .photo{animation-delay:.3s}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.3;pointer-events:none;animation:fl 12s ease-in-out infinite alternate}
.o1{width:320px;height:320px;left:55%;top:6%;background:#2563eb}
.o2{width:260px;height:260px;left:-60px;top:55%;background:#06b6d4;animation-duration:15s}
.o3{width:170px;height:170px;left:42%;top:72%;background:#22d3ee;animation-duration:10s}
.prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:70;background:linear-gradient(90deg,#22d3ee,#2563eb);transform:scaleX(0);transform-origin:left;pointer-events:none}
.links a::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:var(--cyan);transform:scaleX(0);transition:transform .25s}
.links a{position:relative}
.links a.on::after,.links a:hover::after{transform:scaleX(1)}
.rev{opacity:0;translate:0 28px;transition:opacity .75s ease var(--rd,0s),translate .75s cubic-bezier(.2,.8,.2,1) var(--rd,0s)}
.rev.in{opacity:1;translate:0 0}
.rev.in .dots i.f{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.dots i:nth-child(2){animation-delay:.08s!important}.dots i:nth-child(3){animation-delay:.16s!important}.dots i:nth-child(4){animation-delay:.24s!important}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .3s;background:conic-gradient(from var(--a),transparent 0 62%,#22d3ee,#2563eb,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card:hover::before{opacity:1;animation:spin 3.5s linear infinite}
.proj{transition:transform .2s ease-out,border-color .2s;will-change:transform}
.proj .shot img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.proj:hover .shot img{transform:scale(1.07)}
.btn{position:relative;overflow:hidden}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#ffffff59;pointer-events:none;animation:rip .6s ease-out forwards}
.mail{font:700 clamp(1.2rem,3.4vw,1.9rem) var(--hf);text-decoration:none;background:linear-gradient(90deg,#67e8f9,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px;max-width:560px}
.stats b{display:block;font:700 2rem/1.1 var(--hf);color:var(--link)}
.stats span{color:var(--mute);font-size:.85rem}
/* 3D network globe */
#orb{position:absolute;top:50%;left:calc(80% - 322px);width:min(640px,92vw);height:min(640px,92vw);transform:translateY(-50%);pointer-events:none}
@media (min-width:1120px){#orb{left:calc(50% + 14px)}}
@media (max-width:860px){#orb{left:50%;top:235px;width:min(540px,110vw);height:min(540px,110vw);transform:translate(-50%,-50%)}}
/* more motion */
@keyframes glowp{50%{box-shadow:0 0 70px #06b6d44d}}
@keyframes blink{50%{opacity:0}}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(13px);opacity:0}}
@keyframes dotp{from{box-shadow:0 0 0 0 #22d3eecc}to{box-shadow:0 0 0 16px #22d3ee00}}
@keyframes drift{to{transform:translate(6%,-8%) scale(1.15)}}
.hero .photo{animation:up2 .9s cubic-bezier(.2,.8,.2,1) .3s both,glowp 5s ease-in-out 1.3s infinite}
.hero .role{min-height:1.6em}
.caret{display:inline-block;width:2px;height:1em;background:#67e8f9;margin-left:3px;vertical-align:-.12em;animation:blink 1s steps(2) infinite}
.cue{position:absolute;left:50%;bottom:22px;width:24px;height:38px;margin-left:-12px;border:2px solid #ffffff55;border-radius:14px;z-index:2}
.cue span{display:block;width:4px;height:8px;margin:6px auto 0;border-radius:3px;background:#67e8f9;animation:wheel 1.6s ease-in-out infinite}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:16px 0;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.mq-t{display:flex;align-items:center;width:max-content;will-change:transform}
.mq-t span{font:700 clamp(1.1rem,2.4vw,1.6rem) var(--hf);padding:0 20px;color:var(--mute);white-space:nowrap}
.mq-t span:nth-of-type(even){color:transparent;-webkit-text-stroke:1px var(--mute)}
.mq-t i{color:var(--cyan);font-style:normal}
.tl{position:relative}
.tl::after{content:"";position:absolute;left:-2px;top:0;width:2px;height:var(--p,0%);background:linear-gradient(var(--cyan),var(--blue));box-shadow:0 0 10px var(--cyan)}
.tl article.hit::before{animation:dotp 1.6s ease-out}
.proj .shot{position:relative}
.proj .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff40 50%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.proj:hover .shot::after{transition:transform .9s ease;transform:translateX(120%)}
#contact{position:relative;overflow:hidden}
#contact::before{content:"";position:absolute;inset:-30% -10%;background:radial-gradient(420px 300px at 20% 30%,#2563eb30,transparent 70%),radial-gradient(380px 280px at 80% 70%,#06b6d426,transparent 70%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
#contact .wrap{position:relative}
/* multi-page routing + page transition */
#app>section.page{display:none}
#app>section.page.active{display:block}
#app>section.page.active:not(.hero){min-height:62vh}
.mq{display:none}
html[data-page="home"] .mq{display:block}
.next{display:inline-block;margin-top:44px;font:500 .95rem var(--bf);text-decoration:none;color:var(--link);border-bottom:1px solid currentColor;padding-bottom:2px;transition:letter-spacing .25s}
.next:hover{letter-spacing:.04em}
.pt{position:fixed;inset:0;z-index:90;pointer-events:none;visibility:hidden}
.pt.on{visibility:visible;pointer-events:auto}
.pt .st{display:grid;grid-template-columns:repeat(5,1fr);height:100%}
.pt .st i{transform:scaleY(0);transform-origin:bottom;will-change:transform;background:#0b1120;margin:0 -.5px}
.pt .st i:nth-child(even){background:linear-gradient(#0e2a5c,#0b4a6b)}
.pt .pl{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(2rem,7vw,4.5rem) var(--hf);color:#e8eefc;opacity:0}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
<a class="logo" href="#home" id="logo"></a>
<nav class="links" id="links" aria-label="Main"></nav>
<button class="icon" id="theme" aria-label="Toggle dark or light theme">◐</button>
<button class="icon" id="burger" aria-label="Open menu" aria-expanded="false">☰</button>
</div></header>

if(rm){draw(0)}else{hero.addEventListener("pointermove",e=>{const b=hero.getBoundingClientRect();mx=(e.clientX-b.left)/b.width-.5;my=(e.clientY-b.top)/b.height-.5});hero.addEventListener("pointerleave",()=>{mx=my=0});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis&&!raf)raf=requestAnimationFrame(loop)}).observe(hero);raf=requestAnimationFrame(loop)}
})();
/* more motion */
(()=>{const hero=$("#home"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
hero.insertAdjacentHTML("beforeend",'<a class="cue" href="#about" aria-label="Scroll to About"><span></span></a>');
/* tech marquee */
const items=[...C.skills["Programming & Web"],"XAMPP","Laragon","Git & GitHub","Networking","Troubleshooting","Hardware Repair"],set=items.map(t=>`<span>${t}</span><i>✦</i>`).join("");
hero.insertAdjacentHTML("afterend",`<div class="mq" aria-hidden="true"><div class="mq-t">${set}${set}${set}${set}</div></div>`);
const tr=document.querySelector(".mq-t");let x=0,last=scrollY,vel=0,vis=true;
if(!rm){const lap=()=>tr.scrollWidth/4;const f=()=>{const d=scrollY-last;last=scrollY;vel+=(Math.min(40,Math.abs(d))-vel)*.12;x-=.7+vel*.55;const w=lap();if(w&&x<=-w)x+=w;tr.style.transform=`translate3d(${x}px,0,0) skewX(${(-vel*.25).toFixed(2)}deg)`;if(vis)requestAnimationFrame(f);else running=false};let running=true;
new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis&&!running){running=true;requestAnimationFrame(f)}}).observe(tr.parentNode);requestAnimationFrame(f)}
/* typing role */
const role=hero.querySelector(".role");
if(role&&!rm){const rs=[C.title,"Installation Technician","Junior Web Developer"];role.setAttribute("aria-label",C.title);role.innerHTML='<span id="tw" aria-hidden="true"></span><i class="caret" aria-hidden="true"></i>';const tw=$("#tw");let i=0,n=0,del=false;
const step=()=>{const s=rs[i];if(!del){tw.textContent=s.slice(0,++n);if(n===s.length){del=true;return setTimeout(step,1800)}return setTimeout(step,55)}tw.textContent=s.slice(0,--n);if(n===0){del=false;i=(i+1)%rs.length;return setTimeout(step,350)}setTimeout(step,28)};setTimeout(step,1500)}
/* timeline scroll progress */
const tls=[...document.querySelectorAll(".tl")];let tk=0;
const upd=()=>{tk=0;tls.forEach(t=>{const r=t.getBoundingClientRect(),p=rm?1:Math.max(0,Math.min(1,(innerHeight*.65-r.top)/r.height));t.style.setProperty("--p",p*100+"%");t.querySelectorAll("article").forEach(a=>{if(a.getBoundingClientRect().top<innerHeight*.65)a.classList.add("hit")})})};
addEventListener("scroll",()=>{if(!tk)tk=requestAnimationFrame(upd)},{passive:true});upd();
})();
/* multi-page router */
(()=>{const rm=matchMedia("(prefers-reduced-motion:reduce)").matches,pages=[...document.querySelectorAll("#app>section")],ids=pages.map(s=>s.id),R=document.documentElement,
names={home:"Home",about:"About",skills:"Skills",experience:"Experience",education:"Education",projects:"Projects",services:"Services",resume:"Resume",contact:"Contact"};
pages.forEach(s=>s.classList.add("page"));
pages.forEach((s,i)=>{if(!i)return;const n=ids[(i+1)%ids.length],w=s.querySelector(".wrap");if(w)w.insertAdjacentHTML("beforeend",`<a class="next" href="#${n}">${i===ids.length-1?"Back to Home":"Next · "+names[n]} →</a>`)});
const pt=document.createElement("div");pt.className="pt";pt.setAttribute("aria-hidden","true");pt.innerHTML='<div class="st">'+"<i></i>".repeat(5)+'</div><span class="pl"></span>';document.body.appendChild(pt);
const strips=[...pt.querySelectorAll("i")],pl=pt.querySelector(".pl"),ease="cubic-bezier(.76,0,.24,1)",SEL=":is(.eb,h2,.sub,.card,.tl article,.soc a,.note,.mail,.next)";
let cur=null,busy=false,pending=null,io=null,tok=0;
const prep=pg=>{pg.querySelectorAll(SEL).forEach(el=>{el.classList.remove("in");const d=Math.min([...el.parentNode.children].indexOf(el),7);el.style.setProperty("--rd",d*.07+"s");el.classList.add("rev")});pg.querySelectorAll(".hit").forEach(a=>a.classList.remove("hit"))};
const start=(pg,wait)=>{if(io)io.disconnect();const my=++tok;setTimeout(()=>{if(my!==tok)return;io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;io.unobserve(el);el.classList.add("in");setTimeout(()=>{el.classList.remove("rev","in");el.style.removeProperty("--rd")},1300)}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});pg.querySelectorAll(".rev").forEach(el=>io.observe(el))},wait)};
const count=(pg,wait,id)=>{const st=pg.querySelector(".stats");if(!st||rm)return;const bs=[...st.querySelectorAll("b")];bs.forEach(b=>b.textContent="0");setTimeout(()=>{if(cur!==id)return;const t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-k,3);bs.forEach(b=>b.textContent=Math.round(b.dataset.n*e));if(k<1&&cur===id)requestAnimationFrame(f)};requestAnimationFrame(f)},wait+450)};
const swap=(id,wait)=>{const pg=document.getElementById(id);if(!rm&&id!=="home")prep(pg);cur=id;pages.forEach(s=>s.classList.toggle("active",s.id===id));R.dataset.page=id;
document.querySelectorAll("#links a").forEach(a=>a.classList.toggle("on",a.hash==="#"+id));document.title=id==="home"?`${C.name} | ${C.title}`:`${names[id]} | ${C.name}`;
scrollTo({top:0,behavior:"instant"});dispatchEvent(new Event("resize"));dispatchEvent(new Event("scroll"));
if(!rm&&id!=="home"){start(pg,wait);count(pg,wait,id)}};
const go=async(id,instant)=>{if(id===cur)return;if(busy){pending=id;return}
if(instant||cur===null){swap(id,0);return}
if(rm){busy=true;const a=$("#app");await a.animate([{opacity:1},{opacity:0}],{duration:160,fill:"forwards"}).finished;swap(id,0);await a.animate([{opacity:0},{opacity:1}],{duration:240,fill:"forwards"}).finished;a.getAnimations().forEach(x=>x.cancel());busy=false;if(pending&&pending!==cur){const q=pending;pending=null;go(q)}else pending=null;return}
busy=true;pl.textContent=names[id];pt.classList.add("on");strips.forEach(s=>s.style.transformOrigin="bottom");
pl.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:300,delay:230,fill:"forwards",easing:"ease-out"});
await Promise.all(strips.map((s,i)=>s.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],{duration:320,delay:i*45,easing:ease,fill:"forwards"}).finished));
swap(id,380);strips.forEach(s=>s.style.transformOrigin="top");
pl.animate([{opacity:1},{opacity:0}],{duration:240,delay:120,fill:"forwards"});
await Promise.all(strips.map((s,i)=>s.animate([{transform:"scaleY(1)"},{transform:"scaleY(0)"}],{duration:340,delay:i*45+180,easing:ease,fill:"forwards"}).finished));
pt.classList.remove("on");strips.forEach(s=>{s.getAnimations().forEach(a=>a.cancel());s.style.transformOrigin=""});pl.getAnimations().forEach(a=>a.cancel());busy=false;
if(pending&&pending!==cur){const n=pending;pending=null;go(n)}else pending=null};
const parse=()=>{const h=location.hash.slice(1);return !h?"home":ids.includes(h)?h:null};
addEventListener("hashchange",()=>{const id=parse();if(id)go(id)});
go(parse()||"home",true);
})();
/* 404: unknown hash shows a not-found view */
function route(){const h=location.hash.slice(1);if(h&&!document.getElementById(h)&&!document.querySelector(".nf")){$("#app").hidden=true;const d=document.createElement("div");d.className="wrap nf";d.innerHTML='<div><h1>404</h1><p>That page does not exist.</p><a class="btn" href="#home">Back to home</a></div>';$("#app").after(d)}else if(!h||document.getElementById(h)){document.querySelector(".nf")?.remove();$("#app").hidden=false}}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
